name: POC Build Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test synthetic AI generation function
        run: node --test tests/ai-generation.test.mjs tests/delivery-eligibility.test.mjs tests/story-editorial.test.mjs tests/wealth-intelligence.test.mjs tests/genuine-guidance.test.mjs tests/wealth-companion.test.mjs tests/companion-onboarding.test.mjs tests/new-client-lifecycle.test.mjs tests/companion-experience.test.mjs tests/one-app-demo.test.mjs tests/companion-marketing.test.mjs tests/mobile-wealth-story.test.mjs
      - name: Build Vite application
        run: npm run build
