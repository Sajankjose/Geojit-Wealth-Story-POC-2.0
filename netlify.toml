[build]
  command = "npm run build"
  publish = "dist"

# Separate, shareable demo URLs. All paths continue to use the same
# authenticated React app and synthetic review data.
[[redirects]]
  from = "/wealth-story"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/wealth-companion"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
